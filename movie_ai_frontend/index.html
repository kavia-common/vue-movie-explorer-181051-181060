<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Explorer • Royal Purple</title>
    <meta name="description" content="Elegant Vue 3 movie explorer with Supabase and TMDB." />

    <!-- Content Security Policy:
         - Allows only required origins:
           * self
           * Supabase (*.supabase.co) for auth/database/realtime
           * TMDB API (api.themoviedb.org) and images (image.tmdb.org)
         - WebSocket allowances (ws:/wss:) included for local Vite dev/HMR. In production, prefer removing ws: and narrowing connect-src via server/CDN headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; font-src 'self' data:; connect-src 'self' https://api.themoviedb.org https://*.supabase.co wss://*.supabase.co ws: wss:; manifest-src 'self'; upgrade-insecure-requests;"
    />

    <!-- Referrer Policy:
         - strict-origin-when-cross-origin provides good privacy while preserving same-origin analytics -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Permissions Policy:
         - Disable powerful features not used by this SPA -->
    <meta
      http-equiv="Permissions-Policy"
      content="geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=(), interest-cohort=(), browsing-topics=(), fullscreen=(self)"
    />
  </head>
  <body class="h-full">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
